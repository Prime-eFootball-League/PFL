<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFL Zone – Live Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --gold:#c9a84c;--gold2:#f0d080;--gold-glow:rgba(201,168,76,0.35);
  --pitch:#0d1f0f;--dark:#080d08;--surface:#101a10;--surface2:#152015;
  --card:#182218;--card2:#1e2c1e;--border:#2a3d2a;--border2:#3a5a3a;
  --green:#00e87a;--green2:#00ff88;--red:#ff3b5c;--blue:#4db8ff;
  --muted:#5a7a5a;--text:#e8f0e8;--text2:#b0c8b0;
  --tab-bg:#0d1a0d;--thead-bg:#0a150a;
  --card-shadow:0 2px 16px rgba(0,0,0,.6);
  --btn-hover:rgba(201,168,76,.06);
  --pitch-lines:rgba(255,255,255,.03);
}

/* ── PITCH TEXTURE BACKGROUND ── */
body{
  font-family:'DM Sans',sans-serif;
  background:var(--dark);
  color:var(--text);
  padding-bottom:3rem;
  min-height:100vh;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 59px,var(--pitch-lines) 60px),
    repeating-linear-gradient(90deg,transparent,transparent 59px,var(--pitch-lines) 60px);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse 120% 60% at 50% 0%,rgba(0,140,60,.08) 0%,transparent 70%);
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
.hdr{
  background:linear-gradient(180deg,#0a1a0a 0%,#080d08 100%);
  border-bottom:2px solid var(--gold);
  padding:1.4rem 1.2rem 1rem;
  text-align:center;
  position:relative;
  z-index:10;
  box-shadow:0 4px 32px rgba(0,0,0,.8),0 1px 0 var(--gold);
}
.hdr::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.hdr-logo{display:flex;align-items:center;justify-content:center;gap:.9rem}
.hdr-logo img{
  width:54px;height:54px;border-radius:50%;
  border:2px solid var(--gold);
  object-fit:cover;
  box-shadow:0 0 0 3px rgba(201,168,76,.15),0 0 24px rgba(201,168,76,.4);
}
.hdr-logo-text{
  font-family:'Anton',sans-serif;
  font-size:1.8rem;
  color:var(--gold);
  letter-spacing:4px;
  text-transform:uppercase;
  text-shadow:0 0 40px rgba(201,168,76,.5);
  line-height:1;
}
.hdr-sub{
  font-family:'Oswald',sans-serif;
  font-size:.65rem;
  color:var(--muted);
  letter-spacing:4px;
  margin-top:.4rem;
  text-transform:uppercase;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite;box-shadow:0 0 6px var(--green)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

/* ── SYNC INDICATOR ── */
.hdr-live{
  display:inline-flex;align-items:center;gap:.4rem;
  background:rgba(0,232,122,.08);
  border:1px solid rgba(0,232,122,.3);
  color:var(--green);
  padding:.25rem .8rem;
  border-radius:20px;
  font-family:'Oswald',sans-serif;
  font-size:.65rem;font-weight:400;
  letter-spacing:2px;
  margin-top:.6rem;
  transition:all .3s;
  text-transform:uppercase;
}
.hdr-live.syncing{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.4);color:var(--gold)}
.sync-spinner{width:9px;height:9px;border:2px solid rgba(201,168,76,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:none;flex-shrink:0}
.hdr-live.syncing .live-dot{display:none}
.hdr-live.syncing .sync-spinner{display:block}
.hdr-live.syncing .live-text::before{content:'SYNCING'}
.hdr-live:not(.syncing) .live-text::before{content:'LIVE'}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.sec-fade{animation:fadeInUp .22s ease both}
.round-body{overflow:hidden;transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .22s ease}
.round-body.collapsed{max-height:0!important;opacity:0}
.round-body.expanded{opacity:1}
.round-divider:active .round-divider-pill{background:rgba(201,168,76,.18);transform:scale(.97)}
.round-divider .round-divider-pill{transition:background .15s,transform .12s}
.itab:active{transform:scale(.95)!important;opacity:.8}
.t-tab:active{transform:scale(.95)!important;opacity:.8}
.reg-card-tap:active{transform:scale(.98);box-shadow:0 1px 6px rgba(0,0,0,.5)!important}
.past-card:active{transform:scale(.98)}

/* ── TOURNAMENT TABS ── */
.t-tabs{
  display:flex;overflow-x:auto;
  background:var(--tab-bg);
  border-bottom:1px solid var(--border);
  gap:0;
  -webkit-overflow-scrolling:touch;
  position:relative;z-index:9;
}
.t-tabs::-webkit-scrollbar{height:0}
.t-tab{
  flex-shrink:0;
  padding:.7rem 1.2rem;
  background:none;border:none;
  color:var(--muted);
  font-family:'Oswald',sans-serif;
  font-weight:400;font-size:.72rem;
  text-transform:uppercase;letter-spacing:2px;
  cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;
  transition:color .2s,background .2s,border-color .2s;
}
.t-tab:hover{color:var(--gold2);background:var(--btn-hover)}
.t-tab:active{transform:scale(.97)}
.t-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,.04)}

/* ── INNER TABS (top nav bar) ── */
#regTabBar{
  border-bottom:1px solid var(--border);
  background:var(--tab-bg);
  display:flex;
  position:relative;z-index:9;
}
.itabs{
  display:flex;overflow-x:auto;
  border-bottom:1px solid var(--border);
  background:var(--tab-bg);
  -webkit-overflow-scrolling:touch;
  position:relative;z-index:9;
}
.itabs::-webkit-scrollbar{height:0}
.itab{
  flex-shrink:0;
  padding:.65rem 1rem;
  background:none;border:none;
  color:var(--muted);
  font-family:'Oswald',sans-serif;
  font-weight:400;font-size:.68rem;
  text-transform:uppercase;letter-spacing:1.5px;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .2s,background .2s;
  white-space:nowrap;
}
.itab:hover{color:var(--gold2);background:var(--btn-hover)}
.itab:active{transform:scale(.97)}
.itab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,.04)}

/* ── TABLE ── */
.tbl-outer{padding:.9rem .8rem 1.2rem}
.tbl-name{
  font-family:'Anton',sans-serif;
  font-size:1.4rem;color:var(--gold);
  letter-spacing:3px;text-transform:uppercase;
}
.tbl-sub{
  font-family:'Oswald',sans-serif;
  font-size:.65rem;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;
  margin-top:.2rem;
}
.tbl-wrap{
  overflow-x:auto;
  border-radius:10px;
  border:1px solid var(--border);
  box-shadow:var(--card-shadow);
  background:var(--card);
}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:360px}
thead tr{background:var(--thead-bg);border-bottom:1px solid var(--border2)}
th{
  padding:.65rem .5rem;
  text-align:left;
  font-family:'Oswald',sans-serif;
  font-size:.6rem;font-weight:400;
  text-transform:uppercase;letter-spacing:1.5px;
  color:var(--muted);
  white-space:nowrap;
}
th.num{text-align:center}
td{
  padding:.6rem .5rem;
  border-bottom:1px solid rgba(42,61,42,.5);
  max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--card);
  transition:background .15s;
}
td.num{text-align:center;font-family:'Oswald',sans-serif;font-weight:400;font-size:.88rem}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--card2)!important;filter:none}
.pts-cell{
  font-family:'Anton',sans-serif;
  font-size:1.1rem;color:var(--gold);
  text-align:center;
  text-shadow:0 0 12px var(--gold-glow);
}
.z-q td{background:rgba(0,232,122,.04)!important}
.z-e td{background:rgba(255,59,92,.03)!important}
.z-q td:first-child{border-left:3px solid var(--green)}
.z-e td:first-child{border-left:3px solid var(--red)}
.z-n{border-left:3px solid transparent}
.z-legend{
  display:flex;gap:.8rem;flex-wrap:wrap;
  margin:.8rem 0 .3rem;padding:0 .1rem;
}
.zl{display:inline-flex;align-items:center;gap:.4rem;font-family:'Oswald',sans-serif;font-size:.63rem;letter-spacing:1px;color:var(--muted)}
.zl-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── RESULTS / FIXTURES ── */
.results-list{padding:.8rem;position:relative;z-index:1}
.r-item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:.8rem 1rem;
  margin-bottom:.5rem;
  transition:border-color .25s,box-shadow .25s;
  position:relative;overflow:hidden;
}
.r-item::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,232,122,.02),transparent);
  opacity:0;transition:opacity .25s;
  pointer-events:none;
}
.r-item:hover{border-color:rgba(201,168,76,.3);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.r-item:hover::before{opacity:1}
.r-item:last-child{margin-bottom:0}
.r-matchup{display:flex;align-items:center;gap:.5rem}
.r-home-side{flex:1;min-width:0}
.r-away-side{flex:1;min-width:0;text-align:right}
.r-tname{font-family:'Oswald',sans-serif;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.r-tcoach{font-size:.62rem;color:var(--muted);margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'DM Sans',sans-serif}
.r-away-side .r-tname{text-align:right}
.r-away-side .r-tcoach{text-align:right}
.r-score-badge{flex-shrink:0;text-align:center}
.r-score{
  font-family:'Anton',sans-serif;
  font-size:1.35rem;color:var(--gold);
  letter-spacing:4px;line-height:1;
  text-shadow:0 0 16px var(--gold-glow);
}
.r-meta{font-family:'Oswald',sans-serif;font-size:.6rem;color:var(--muted);text-align:center;margin-top:.2rem;letter-spacing:1px}

/* ── FIXTURE CARDS ── */
.fix-item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:.6rem;
  overflow:hidden;
  transition:border-color .25s,box-shadow .25s;
  box-shadow:var(--card-shadow);
}
.fix-item:hover{border-color:rgba(201,168,76,.3);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.fix-header{display:flex;align-items:center;padding:.8rem 1rem;gap:.5rem}
.fix-team-side{flex:1;min-width:0}
.fix-team-name{
  font-family:'Oswald',sans-serif;font-weight:600;
  font-size:1rem;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.1;display:block;
}
.fix-team-coach{font-size:.6rem;color:var(--muted);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fix-home .fix-team-name{color:var(--text);text-align:left}
.fix-home .fix-team-coach{text-align:left}
.fix-away{text-align:right}
.fix-away .fix-team-name{color:var(--text);text-align:right}
.fix-away .fix-team-coach{text-align:right}
.fix-vs-badge{
  flex-shrink:0;width:36px;height:36px;border-radius:50%;
  background:var(--card2);border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:.6rem;font-weight:600;
  color:var(--gold);letter-spacing:1px;
}
.fix-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:.35rem 1rem .5rem;
  border-top:1px solid var(--border);
  background:var(--card2);
}
.fix-date{font-family:'Oswald',sans-serif;font-size:.62rem;color:var(--muted);letter-spacing:1px}
.fix-round-label{font-family:'Oswald',sans-serif;font-size:.6rem;color:var(--gold);font-weight:400;letter-spacing:1.5px;text-transform:uppercase}

/* ── PLAYOFF ITEMS ── */
.po-item{
  background:var(--card2);border:1px solid var(--border);
  border-radius:10px;padding:.9rem;margin-bottom:.7rem;
  box-shadow:var(--card-shadow);
}
.po-teams{font-family:'Oswald',sans-serif;font-weight:600;font-size:.9rem;letter-spacing:.5px}
.po-meta{font-size:.72rem;color:var(--muted);margin:.2rem 0;font-family:'DM Sans',sans-serif}
.po-score{
  font-family:'Anton',sans-serif;font-size:1.5rem;
  color:var(--gold);letter-spacing:4px;
  text-align:center;padding:.5rem 0;
  text-shadow:0 0 20px var(--gold-glow);
}
.po-winner{text-align:center;color:var(--green);font-family:'Oswald',sans-serif;font-weight:600;font-size:.8rem;letter-spacing:1px}

/* ── REGISTRY CARDS ── */
.reg-entry{margin-bottom:.7rem}
.reg-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:1rem 1.1rem;
  display:flex;align-items:center;gap:1rem;
  transition:border-color .2s,box-shadow .2s;
  box-shadow:var(--card-shadow);
}
.reg-card-tap{cursor:pointer;user-select:none}
.reg-card-tap:hover{border-color:rgba(201,168,76,.4);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.reg-card-tap:active{background:var(--card2)}
.reg-chevron{font-size:.8rem;color:var(--muted);flex-shrink:0;transition:color .2s}
.reg-expand{
  background:var(--card2);border:1px solid var(--border);
  border-top:none;border-radius:0 0 12px 12px;padding:.9rem 1rem;
}
.reg-badge{
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,rgba(201,168,76,.12),rgba(201,168,76,.03));
  border:1.5px solid rgba(201,168,76,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;flex-shrink:0;
}
.reg-name{font-family:'Anton',sans-serif;font-size:1.15rem;letter-spacing:2px;color:var(--gold);line-height:1;text-transform:uppercase}
.reg-meta{font-size:.68rem;color:var(--muted);margin-top:.25rem;font-family:'DM Sans',sans-serif}

/* ── TEAM CARD ── */
.team-select-wrap{margin-bottom:1.2rem}
.team-select-wrap label{
  display:block;
  font-family:'Oswald',sans-serif;font-size:.65rem;font-weight:400;
  letter-spacing:2px;color:var(--muted);text-transform:uppercase;
  margin-bottom:.5rem;
}
.team-dropdown{
  width:100%;background:var(--card2);
  border:1.5px solid var(--border);
  color:var(--text);
  font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:400;
  padding:.7rem .9rem;border-radius:10px;
  appearance:none;-webkit-appearance:none;
  cursor:pointer;outline:none;
  transition:border-color .2s,box-shadow .2s;
  letter-spacing:.5px;
}
.team-dropdown:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.1)}
.team-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow)}
.team-card-header{
  background:linear-gradient(135deg,var(--card2),var(--card));
  border-bottom:2px solid var(--gold);
  padding:1.1rem 1.2rem .9rem;
  display:flex;align-items:center;gap:1rem;
}
.team-card-avatar{
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.04));
  border:2px solid rgba(201,168,76,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;flex-shrink:0;
  box-shadow:0 0 16px rgba(201,168,76,.25);
}
.team-card-title{flex:1;min-width:0}
.team-card-name{
  font-family:'Anton',sans-serif;font-size:1.4rem;
  letter-spacing:3px;color:var(--gold);line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 0 24px var(--gold-glow);
}
.team-card-coach{font-size:.7rem;color:var(--muted);margin-top:.25rem;font-family:'DM Sans',sans-serif}
.team-card-pos{
  font-family:'Oswald',sans-serif;font-size:1rem;
  color:var(--green);letter-spacing:1px;
  background:rgba(0,232,122,.08);
  border:1px solid rgba(0,232,122,.3);
  border-radius:8px;padding:.25rem .7rem;
  flex-shrink:0;text-align:center;
  box-shadow:0 0 12px rgba(0,232,122,.1);
}
.team-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border)}
.stat-cell{background:var(--card2);padding:.65rem .4rem;text-align:center}
.stat-val{font-family:'Anton',sans-serif;font-size:1.3rem;color:var(--gold)}
.stat-lbl{
  font-family:'Oswald',sans-serif;font-size:.55rem;
  color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:.1rem;
}
.team-card-body{padding:.9rem 1rem}
.form-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
.form-label{
  font-family:'Oswald',sans-serif;font-size:.62rem;font-weight:400;
  letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;white-space:nowrap;
}
.form-squares{display:flex;gap:.35rem}
.form-sq{
  width:26px;height:26px;border-radius:5px;
  font-family:'Oswald',sans-serif;font-size:.72rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  color:#000;letter-spacing:.5px;
}
.form-sq.W{background:var(--green);box-shadow:0 0 8px rgba(0,232,122,.4)}
.form-sq.D{background:var(--gold);box-shadow:0 0 8px rgba(201,168,76,.4)}
.form-sq.L{background:var(--red);box-shadow:0 0 8px rgba(255,59,92,.3)}
.form-sq.none{background:var(--border);color:var(--muted)}
.extra-stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.extra-stat-item{
  background:var(--card2);border:1px solid var(--border);
  border-radius:8px;padding:.6rem .8rem;
  display:flex;justify-content:space-between;align-items:center;
}
.extra-stat-lbl{font-family:'Oswald',sans-serif;font-size:.62rem;color:var(--muted);letter-spacing:.5px}
.extra-stat-val{font-family:'Anton',sans-serif;font-size:1rem;color:var(--text)}

/* ── PAST SEASONS ── */
.past-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:1rem 1.1rem;margin-bottom:.8rem;
  cursor:pointer;transition:border-color .2s,box-shadow .2s;
  box-shadow:var(--card-shadow);
}
.past-card:hover{border-color:rgba(201,168,76,.4);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.past-card:active{background:var(--card2)}
.past-card-name{font-family:'Anton',sans-serif;font-size:1.25rem;letter-spacing:2px;color:var(--gold);line-height:1}
.past-card-meta{font-size:.7rem;color:var(--muted);margin-top:.3rem;font-family:'DM Sans',sans-serif}
.past-view-header{
  display:flex;align-items:center;gap:.7rem;
  padding:.9rem;background:var(--card);
  border-bottom:1px solid var(--border);
}
.past-back{background:none;border:none;color:var(--gold);font-size:1.2rem;cursor:pointer;flex-shrink:0;padding:.2rem}
.past-view-name{font-family:'Anton',sans-serif;font-size:1rem;letter-spacing:1.5px;color:var(--gold)}

/* ── PER-TOURNAMENT TEAM STAT ROWS ── */
.tour-stat-row{border:1px solid var(--border);border-radius:10px;margin-bottom:.6rem;overflow:hidden}
.tour-stat-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.7rem .9rem;background:var(--card2);
  cursor:pointer;user-select:none;
  transition:background .2s;
}
.tour-stat-header:hover{background:rgba(201,168,76,.06)}
.tour-stat-name{font-family:'Oswald',sans-serif;font-size:.85rem;font-weight:600;color:var(--text);letter-spacing:.5px}
.tour-stat-pts{font-family:'Anton',sans-serif;font-size:.9rem;color:var(--gold);letter-spacing:1px}
.tour-stat-chv{font-size:.7rem;color:var(--muted);transition:color .2s}
.tour-stat-body{display:none;padding:.7rem .8rem;background:var(--card)}

/* ── MATCH SCHEDULE ── */
.ms-section{margin-top:.9rem;border-top:1px solid var(--border);padding-top:.8rem}
.ms-title{font-family:'Oswald',sans-serif;font-size:.68rem;font-weight:400;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
.ms-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.3),transparent)}
.ms-match{display:flex;align-items:center;gap:.5rem;padding:.45rem .5rem;border-radius:7px;margin-bottom:.3rem;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);transition:background .15s}
.ms-match:hover{background:rgba(201,168,76,.04)}
.ms-match:last-child{margin-bottom:0}
.ms-badge{flex-shrink:0;width:20px;height:20px;border-radius:4px;font-family:'Oswald',sans-serif;font-size:.6rem;font-weight:600;display:flex;align-items:center;justify-content:center;color:#000}
.ms-badge.W{background:var(--green)}
.ms-badge.D{background:var(--gold)}
.ms-badge.L{background:var(--red)}
.ms-badge.upcoming{background:var(--border);color:var(--muted);font-size:.55rem}
.ms-teams{flex:1;min-width:0;font-family:'DM Sans',sans-serif;font-size:.72rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-teams strong{color:var(--text);font-weight:700}
.ms-score{font-family:'Oswald',sans-serif;font-size:.78rem;font-weight:600;color:var(--gold);flex-shrink:0;min-width:2rem;text-align:right}

/* ── PREDICTION BAR ── */
.pred-wrap{margin-top:.7rem;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem}
.pred-label{font-family:'Oswald',sans-serif;font-size:.6rem;font-weight:400;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:.45rem;text-align:center}
.pred-teams-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem}
.pred-team-name{font-family:'Oswald',sans-serif;font-size:.7rem;font-weight:600;color:var(--text);max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pred-bar-l{background:var(--red);transition:width .5s}
.pred-pcts{display:flex;justify-content:space-between;font-family:'Oswald',sans-serif;font-size:.63rem;font-weight:400}
.pred-pct-w{color:var(--green)}

/* ── MISC ── */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:.85rem;font-family:'Oswald',sans-serif;letter-spacing:1px}

/* ── WINNER TICKER ── */
@keyframes tickerScroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.winner-ticker{
  position:fixed;left:0;width:100%;
  background:linear-gradient(90deg,#08100a,#0f1e10,#08100a);
  z-index:200;overflow:hidden;height:2.2rem;
  display:flex;align-items:center;
}
.winner-ticker.ticker-top{top:0;border-bottom:2px solid var(--gold)}
.winner-ticker.ticker-bottom{bottom:0;border-top:2px solid var(--gold)}
.winner-ticker-inner{
  white-space:nowrap;
  font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:600;

  text-shadow:0 0 14px rgba(201,168,76,.8);

}
.winner-ticker-inner.scroll-a{animation:tickerScroll 20s linear infinite}
.winner-ticker-inner.scroll-b{animation:tickerScroll 20s linear infinite;animation-delay:-10s}
@keyframes trophyGlow{
  0%{filter:drop-shadow(0 0 18px rgba(201,168,76,0.8)) drop-shadow(0 0 36px rgba(201,168,76,0.4))}
  100%{filter:drop-shadow(0 0 32px rgba(201,168,76,1)) drop-shadow(0 0 70px rgba(201,168,76,0.7)) drop-shadow(0 0 100px rgba(240,208,128,0.3))}
}

/* ── SKELETON LOADING ── */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skel{

}

.rank-plain{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-family:'Oswald',sans-serif;font-size:.85rem;color:var(--muted);flex-shrink:0}

<script>
// ── Firebase init ──────────────────────────────────────────────
firebase.initializeApp({
  apiKey:"AIzaSyD21v-QNpT2SghsPYZY5OIzxKoa_zwd9B0",
  authDomain:"prime-efootball-league-pfl.firebaseapp.com",
  projectId:"prime-efootball-league-pfl",
  storageBucket:"prime-efootball-league-pfl.firebasestorage.app",
  messagingSenderId:"787228989452",
  appId:"1:787228989452:web:6273826b83aa86fe37fa1d",
  databaseURL:"https://prime-efootball-league-pfl-default-rtdb.firebaseio.com"
});
var fbDb = firebase.database();

var db={tournaments:[]};
var activeTid=null;
var activeSection='table';
var activeTopTab='tourney'; // 'tourney' | 'reg' | 'past' — tracks which top tab user is on
var registryTeams=[];

function getTour(){return db.tournaments.find(function(t){return t.id===activeTid;})||null;}
function openTour(tid){
  activeTid=tid;
  document.querySelectorAll('.t-tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tid')===tid);});
  document.getElementById('iTabs').style.display='flex';
  showSec('table');
}

function showSec(name){
  activeSection=name;
  var secs=['table','results','fixtures','playoffs','goals','teams','rules'];
  secs.forEach(function(s){
    var el=document.getElementById('sec'+s.charAt(0).toUpperCase()+s.slice(1));
    if(el) el.style.display='none';
  });
  var btns=['table','results','fixtures','playoffs','goals','rules'];
  btns.forEach(function(s){
    var b=document.getElementById('it-'+s);
    if(b) b.classList.toggle('active',s===name);
  });
  var target=document.getElementById('sec'+name.charAt(0).toUpperCase()+name.slice(1));
  if(target){target.style.display='';target.classList.remove('sec-fade');void target.offsetWidth;target.classList.add('sec-fade');}
  if(name==='table') renderTable();
  else if(name==='results') renderResults();
  else if(name==='fixtures') renderFixtures();
  else if(name==='playoffs') renderPlayoffs();
  else if(name==='goals') renderGoalsRanking();
  else if(name==='teams') renderTeams();
  else if(name==='rules') renderRules();
}

function showRegTab(){
  activeTopTab='reg';
  document.getElementById('secRegistry').style.display='block';
  document.getElementById('secPast').style.display='none';
  document.getElementById('tourContent').style.display='none';
  document.getElementById('it-reg').classList.add('active');
  document.getElementById('it-past').classList.remove('active');
  document.getElementById('it-tourney').classList.remove('active');
  renderPublicRegistry();
}
function showPastTab(){
  activeTopTab='past';
  document.getElementById('secRegistry').style.display='none';
  document.getElementById('secPast').style.display='block';
  document.getElementById('tourContent').style.display='none';
  document.getElementById('it-reg').classList.remove('active');
  document.getElementById('it-past').classList.add('active');
  document.getElementById('it-tourney').classList.remove('active');
  renderPastSeasons();
}

function renderPastSeasons(){
  var el=document.getElementById('secPast');
  var finished=db.tournaments.filter(function(t){return t.status==='finished';});
  if(!finished.length){el.innerHTML='<div class="empty"><div class="empty-icon">🏁</div>No past seasons yet</div>';return;}
  var h='<div style="font-family:\'Anton\',sans-serif;font-size:1.2rem;letter-spacing:3px;color:var(--gold);text-align:center;margin-bottom:1rem;text-transform:uppercase">Past Seasons</div>';
  finished.forEach(function(t){
    var winner='';
    if(t.bracketRounds&&t.bracketRounds.length){
      var frs=t.bracketRounds.filter(function(r){return r.matches[0]&&!r.matches[0].is3rd;});
      var fr=frs[frs.length-1];
      if(fr&&fr.matches[0]&&fr.matches[0].winner) winner=fr.matches[0].winner.name;
    }
    h+='<div class="past-card" onclick="viewPastSeason(\''+t.id+'\')">'+
      '<div class="past-card-name">'+t.name+'</div>'+
      '<div class="past-card-meta">'+(t.season||'')+(winner?' &middot; 🏆 '+winner:'')+'</div>'+
      '</div>';
  });
  el.innerHTML=h;
}

function viewPastSeason(tid){
  var el=document.getElementById('secPast');
  var tour=db.tournaments.find(function(t){return t.id===tid;});
  if(!tour) return;
  var secs=['table','results','fixtures','playoffs','goals','rules'];
  var content='<div class="past-view-header">'+
    '<button class="past-back" onclick="renderPastSeasons()">&#8592;</button>'+
    '<div class="past-view-name">'+tour.name+'</div>'+
    '</div>'+
    '<div style="display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--tab-bg)">';
  secs.forEach(function(s,i){
    content+='<button class="itab'+(i===0?' active':'')+'" onclick="showPastSec(\''+tid+'\',\''+s+'\',this)">'+s.charAt(0).toUpperCase()+s.slice(1)+'</button>';
  });
  content+='</div><div id="pastSecContent"></div>';
  el.innerHTML=content;
  showPastSec(tid,'table',el.querySelector('.itab'));
}

function showPastSec(tid,name,btn){
  var el=document.getElementById('pastSecContent');
  if(!el) return;
  document.querySelectorAll('#secPast .itab').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  var prevTid=activeTid;
  activeTid=tid;
  var secIds={'table':'secTable','results':'secResults','fixtures':'secFixtures','playoffs':'secPlayoffs','goals':'secGoals','rules':'secRules'};
  var secId=secIds[name];
  var realSec=document.getElementById(secId);
  var prevHTML=realSec?realSec.innerHTML:'';
  if(name==='table') renderTable();
  else if(name==='results') renderResults();
  else if(name==='fixtures') renderFixtures();
  else if(name==='playoffs') renderPlayoffs();
  else if(name==='goals') renderGoalsRanking();
  else if(name==='rules') renderRules();
  var rendered=realSec?realSec.innerHTML:'';
  var wrapClass=name==='table'?'':'results-list';
  el.innerHTML=wrapClass?'<div class="'+wrapClass+'">'+rendered+'</div>':rendered;
  if(realSec) realSec.innerHTML=prevHTML;
  activeTid=prevTid;
}

function showTourTab(){
  activeTopTab='tourney';
  document.getElementById('secRegistry').style.display='none';
  document.getElementById('secPast').style.display='none';
  document.getElementById('tourContent').style.display='block';
  document.getElementById('it-reg').classList.remove('active');
  document.getElementById('it-past').classList.remove('active');
  document.getElementById('it-tourney').classList.add('active');
  if(activeTid){
    document.getElementById('iTabs').style.display='flex';
    showSec('table');
  } else {
    document.getElementById('iTabs').style.display='none';
    document.getElementById('secTable').innerHTML='<div class="empty"><div class="empty-icon">🏆</div>No tournaments yet</div>';
  }
}

function renderPublicRegistry(){
  var el=document.getElementById('secRegistry');
  var teams=registryTeams;
  if(!teams.length){el.innerHTML='<div class="empty"><div class="empty-icon">🏅</div>No teams registered yet</div>';return;}
  var sorted=teams.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var h='<div style="font-family:\'Anton\',sans-serif;font-size:1.2rem;letter-spacing:3px;color:var(--gold);text-align:center;margin-bottom:1rem;text-transform:uppercase">🏅 Registered Teams</div>';
  sorted.forEach(function(t){
    var safeId='reg_'+t.id.replace(/[^a-zA-Z0-9]/g,'_');
    var logoHtml=logoImg(t.name,44,t);
    h+='<div class="reg-entry">'+
      '<div class="reg-card reg-card-tap" onclick="toggleRegCard(\''+safeId+'\',\''+t.id+'\')">'+
      '<div class="reg-badge" style="background:none;border:none;padding:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center">'+logoHtml+'</div>'+
      '<div style="min-width:0;flex:1">'+
      '<div class="reg-name">'+t.name+'</div>'+
      '<div class="reg-meta">'+(t.coach?'🧢 '+t.coach:'No coach listed')+' &middot; Since '+(t.dateCreated||'—')+'</div>'+
      '</div>'+
      '<div class="reg-chevron" id="chv_'+safeId+'">▼</div>'+
      '</div>'+
      '<div class="reg-expand acc-closed" id="'+safeId+'" style="max-height:0"></div>'+
      '</div>';
  });
  el.innerHTML=h;
}

function toggleRegCard(safeId,regTeamId){
  var panel=document.getElementById(safeId);
  var chv=document.getElementById('chv_'+safeId);
  if(!panel) return;
  var isOpen=panel.classList.contains('acc-open');
  // Close all panels
  document.querySelectorAll('.reg-expand').forEach(function(p){
    p.classList.remove('acc-open');
    p.classList.add('acc-closed');
    p.style.maxHeight='0';
  });
  document.querySelectorAll('.reg-chevron').forEach(function(c){c.textContent='▼';c.style.color='';});
  if(isOpen){return;}
  // Open this one
  panel.innerHTML=buildRegStats(regTeamId);
  panel.classList.remove('acc-closed');
  panel.classList.add('acc-open');
  panel.style.maxHeight=panel.scrollHeight+'px';
  // After transition, set to none so content can grow freely
  setTimeout(function(){if(panel.classList.contains('acc-open'))panel.style.maxHeight='none';},320);
  if(chv){chv.textContent='▲';chv.style.color='var(--gold)';}
}

var GITHUB_LOGOS_BASE='https://prime-efootball-league.github.io/Pfl-logo/';

function getLogoUrl(team){
  var name=typeof team==='string'?team:(team.name||'');
  // 1. GitHub filename stored in registry — highest priority
  if(typeof team==='object'&&team.logoFilename) return GITHUB_LOGOS_BASE+team.logoFilename;
  // 2. Legacy custom URL stored in registry
  if(typeof team==='object'&&team.logoUrl) return team.logoUrl;
  // 3. Auto-pack lookup by name
  var key=name.trim().toLowerCase();
  if(LOGO_PACK[key]) return LOGO_PACK[key];
  // 4. Partial match
  var keys=Object.keys(LOGO_PACK);
  for(var i=0;i<keys.length;i++){
    if(key.indexOf(keys[i])!==-1||keys[i].indexOf(key)!==-1) return LOGO_PACK[keys[i]];
  }
  return null;
}

function logoImg(name,size,regTeam){
  // regTeam optional — registry team object for custom logoUrl
  var src=regTeam?getLogoUrl(regTeam):getLogoUrl(name);
  if(src){
    return '<img src="'+src+'" alt="'+name+'" style="width:'+size+'px;height:'+size+'px;object-fit:contain;border-radius:3px;flex-shrink:0" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
      +'<span style="display:none;width:'+size+'px;height:'+size+'px;border-radius:50%;background:var(--card2);border:1px solid var(--border);align-items:center;justify-content:center;font-size:'+(size*0.45)+'px;flex-shrink:0">\u26bd</span>';
  }
  return '<span style="display:flex;width:'+size+'px;height:'+size+'px;border-radius:50%;background:var(--card2);border:1px solid var(--border);align-items:center;justify-content:center;font-size:'+(size*0.45)+'px;flex-shrink:0">\u26bd</span>';
}

function getRegTeamByName(name){
  if(!name) return null;
  var n=name.trim().toLowerCase();
  // 1. Exact match
  var exact=registryTeams.find(function(r){return r.name.trim().toLowerCase()===n;});
  if(exact) return exact;
  // 2. One contains the other (e.g. "Lexington" vs "Lexington SC")
  var partial=registryTeams.find(function(r){
    var rn=r.name.trim().toLowerCase();
    return rn.indexOf(n)!==-1||n.indexOf(rn)!==-1;
  });
  return partial||null;
}

function getRegTeamById(id){
  if(!id) return null;
  return registryTeams.find(function(r){return r.id===id;})||null;
}

// Best way to get registry team — uses registryId (stored on tournament team) first, then name
function resolveRegTeam(tournamentTeam){
  if(!tournamentTeam) return null;
  // If tournament team stores a registryId, use it — fastest and most reliable
  if(tournamentTeam.registryId){
    var byId=getRegTeamById(tournamentTeam.registryId);
    if(byId) return byId;
  }
  // Fall back to name match
  return getRegTeamByName(tournamentTeam.name);
}

function calcPrediction(teamA,teamB,tourMatches){
  function getRes(team){
    var pl=(tourMatches||[]).filter(function(m){return m.done&&(m.homeId===team.id||m.awayId===team.id);});
    var w=0,d=0,l=0;
    pl.forEach(function(m){
      var ih=m.homeId===team.id;
      var gf=ih?m.homeScore:m.awayScore;
      var ga=ih?m.awayScore:m.homeScore;
      if(gf>ga)w++;else if(gf===ga)d++;else l++;
    });
    return{w:w,d:d,l:l,total:pl.length};
  }
  var rA=getRes(teamA),rB=getRes(teamB);
  if(rA.total===0&&rB.total===0)return null;
  var wA=rA.total>0?rA.w/rA.total:0.33;
  var dA=rA.total>0?rA.d/rA.total:0.33;
  var lA=rA.total>0?rA.l/rA.total:0.33;
  var wB=rB.total>0?rB.w/rB.total:0.33;
  var dB=rB.total>0?rB.d/rB.total:0.33;
  var lB=rB.total>0?rB.l/rB.total:0.33;
  var rw=(wA+lB)/2,rd=(dA+dB)/2,rl=(wB+lA)/2;
  var tot=rw+rd+rl;
  var pW=Math.round((rw/tot)*100),pD=Math.round((rd/tot)*100),pL=100-pW-pD;
  return{pW:pW,pD:pD,pL:pL,playedA:rA.total,playedB:rB.total};
}

  });

function loadFromStorage(){

    if(d){db=JSON.parse(d);if(Array.isArray(db.tournaments))db.tournaments.forEach(normalizeTour);}
  }catch(e){db={tournaments:[]};}
}
function saveToStorage(data){
  try{localStorage.setItem('pfl_db',JSON.stringify(data));}catch(e){}
}

// ── Sync indicator helpers ─────────────────────────────────────
function syncStart(){var b=document.getElementById('livebadge');if(b)b.classList.add('syncing');}
function syncEnd(){var b=document.getElementById('livebadge');if(b)b.classList.remove('syncing');}

// ── Firebase fetch ─────────────────────────────────────────────
function normalizeTour(t){
  if(!t) return t;
  if(!Array.isArray(t.teams)) t.teams=[];
  if(!Array.isArray(t.matches)) t.matches=[];
  if(!Array.isArray(t.groups)) t.groups=[];
  if(!Array.isArray(t.playoffs)) t.playoffs=[];
  return t;
}

function fetchFromFirebase(){
  syncStart();
  // Load registry FIRST so logos are ready before the table renders
  fbDb.ref('registry').once('value').then(function(regSnap){
    var regData=regSnap.val();
    registryTeams=regData?Object.values(regData):[];
    // Now fetch tournaments — registry is already populated
    return fbDb.ref('tournaments').once('value');
  }).then(function(snap){
    var data=snap.val();
    syncEnd();
    var tours=data?Object.values(data):[];
    tours.forEach(normalizeTour);
    db={tournaments:tours};

    var allFinished=tours.length>0&&tours.every(function(t){return t.status==='finished';});
    // First load: activeTid is still null and user hasn't navigated anywhere
    var isFirstLoad=!activeTid;

    if(isFirstLoad){
      renderTournamentTabs();
      if(allFinished){
        showPastTab();
      } else if(activeTid){
        activeTopTab='tourney';
        document.getElementById('secRegistry').style.display='none';
        document.getElementById('secPast').style.display='none';
        document.getElementById('tourContent').style.display='block';
        document.getElementById('it-reg').classList.remove('active');
        document.getElementById('it-past').classList.remove('active');
        document.getElementById('it-tourney').classList.add('active');
        document.getElementById('iTabs').style.display='flex';
        render(activeSection);
      } else {
        activeTopTab='reg';
        document.getElementById('secRegistry').style.display='block';
        document.getElementById('secPast').style.display='none';
        document.getElementById('tourContent').style.display='none';
        document.getElementById('it-reg').classList.add('active');
        document.getElementById('it-past').classList.remove('active');
        document.getElementById('it-tourney').classList.remove('active');
        renderPublicRegistry();
      }
    } else {
      // Silent background refresh — stay exactly where the user is
      renderTournamentTabs();
      if(activeTopTab==='tourney'){
        var stillExists=tours.find(function(t){return t.id===activeTid;});
        if(!stillExists){
          // Tournament was deleted — gracefully fall back to registry
          activeTid=tours.length?tours[0].id:null;
          activeTopTab='reg';
          document.getElementById('secRegistry').style.display='block';
          document.getElementById('secPast').style.display='none';
          document.getElementById('tourContent').style.display='none';
          document.getElementById('it-reg').classList.add('active');
          document.getElementById('it-past').classList.remove('active');
          document.getElementById('it-tourney').classList.remove('active');
          renderPublicRegistry();
        } else {
          // Silently re-render current inner section — no tab change
          render(activeSection);
        }
      } else if(activeTopTab==='reg'){
        renderPublicRegistry();
      } else if(activeTopTab==='past'){
        renderPastSeasons();
      }
    }

    updateWinnerTicker();
  }).catch(function(){syncEnd();});
}

function init(){
  activeSection='table';

}

// ── Tournament tabs ────────────────────────────────────────────
function renderTournamentTabs(){
  var tabs=document.getElementById('tTabs');
  var allTours=db.tournaments;
  var tours=allTours.filter(function(t){return t.status!=='finished';});
  if(!tours||!tours.length){
    tabs.innerHTML='';
    if(activeTid){var active=allTours.find(function(t){return t.id===activeTid;});if(!active||active.status==='finished')activeTid=null;}
    return;
  }
  if(!activeTid){activeTid=tours[0].id;}
  else{var cur=allTours.find(function(t){return t.id===activeTid;});if(!cur||cur.status==='finished')activeTid=tours[0].id;}
  tabs.innerHTML=tours.map(function(t){
    return '<button class="t-tab'+(activeTid===t.id?' active':'')+'" data-tid="'+t.id+'">'+t.name+'</button>';
  }).join('');
  tabs.querySelectorAll('.t-tab').forEach(function(btn){
    btn.addEventListener('click',function(){openTour(btn.getAttribute('data-tid'));});
  });
}

function render(name){
  var secs=['table','results','fixtures','playoffs','goals','teams','rules'];
  secs.forEach(function(s){
    var el=document.getElementById('sec'+s.charAt(0).toUpperCase()+s.slice(1));
    if(el) el.style.display='none';
  });
  var target=document.getElementById('sec'+name.charAt(0).toUpperCase()+name.slice(1));
  if(target){target.style.display='';target.classList.remove('sec-fade');void target.offsetWidth;target.classList.add('sec-fade');}
  if(name==='table') renderTable();
  else if(name==='results') renderResults();
  else if(name==='fixtures') renderFixtures();
  else if(name==='playoffs') renderPlayoffs();
  else if(name==='goals') renderGoalsRanking();
  else if(name==='teams') renderTeams();
  else if(name==='rules') renderRules();
}

function sortTeams(teams){
  return teams.slice().sort(function(a,b){
    if(b.points!==a.points) return b.points-a.points;
    var gdA=a.goalsFor-a.goalsAgainst, gdB=b.goalsFor-b.goalsAgainst;
    if(gdB!==gdA) return gdB-gdA;
    return b.goalsFor-a.goalsFor;
  });
}

// ── TABLE ──────────────────────────────────────────────────────
function renderTable(){
  var tour=getTour();
  var el=document.getElementById('secTable');
  if(!tour){el.innerHTML='<div class="empty">No data</div>';return;}
  var html='<div class="tbl-outer">'+
    '<div style="margin-bottom:.8rem">'+
    '<div class="tbl-name">'+tour.name+'</div>'+
    '<div class="tbl-sub">'+(tour.season||'')+' &middot; '+(tour.format==='league'?'League Phase':'Group Stage')+' &middot; '+tour.teams.length+' Teams</div>'+
    '</div>';
  if(!tour.teams.length){html+='<div class="empty" style="padding:2rem 0">No teams registered yet</div></div>';el.innerHTML=html;return;}
  if(tour.format==='league'){html+=buildTable(tour,sortTeams(tour.teams));}
  else{
    var groups={};
    tour.teams.forEach(function(t){if(!groups[t.group])groups[t.group]=[];groups[t.group].push(t);});
    Object.keys(groups).sort().forEach(function(g){
      html+='<div class="grp-title">Group '+g+'</div>';
      html+=buildTable(tour,sortTeams(groups[g]));
    });
  }
  html+='</div>';
  el.innerHTML=html;
}

function buildTable(tour,teams){
  var adv;
  if(tour.format==='groups'){adv=tour.groupAdv;}
  else if(tour.bracketRounds&&tour.bracketRounds.length){
    var fr=tour.bracketRounds.find(function(r){return r.matches&&r.matches[0]&&!r.matches[0].is3rd;});
    adv=fr?fr.matches.length*2:(tour.bracketSize||tour.leagueAdv);
  } else {adv=tour.leagueAdv;}
  var h='<div class="tbl-wrap"><table><thead><tr>'+
    '<th>Pos</th><th>Team</th>'+
    '<th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th>'+
    '<th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th>'+
    '</tr></thead><tbody>';
  teams.forEach(function(t,i){
    var pos=i+1,gd=t.goalsFor-t.goalsAgainst;
    var zone=pos<=adv?'z-q':'z-e';
    var topBorder=i===adv?'border-top:1.5px dashed rgba(255,255,255,.1)':'';
    var regT=resolveRegTeam(t);
    var rankClass=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
    var rankBadge=i===0?'<span class="rank-gold">1</span>':i===1?'<span class="rank-silver">2</span>':i===2?'<span class="rank-bronze">3</span>':'<span class="rank-plain">'+pos+'</span>';
    h+='<tr class="'+zone+' '+rankClass+'" style="'+topBorder+'">'+
      '<td>'+rankBadge+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:.5rem">'+logoImg(t.name,22,regT)+'<strong style="font-family:\'DM Sans\',sans-serif;font-weight:700">'+t.name+'</strong></div></td>'+
      '<td class="num">'+t.played+'</td>'+
      '<td class="num" style="color:var(--green)">'+t.won+'</td>'+
      '<td class="num">'+t.drawn+'</td>'+
      '<td class="num" style="color:var(--red)">'+t.lost+'</td>'+
      '<td class="num">'+t.goalsFor+'</td>'+
      '<td class="num">'+t.goalsAgainst+'</td>'+
      '<td class="num" style="color:'+(gd>0?'var(--green)':gd<0?'var(--red)':'var(--text)')+'">'+
      (gd>=0?'+':'')+gd+'</td>'+
      '<td class="pts-cell">'+t.points+'</td>'+
      '</tr>';
  });
  h+='</tbody></table></div>';
  var hasBracket=tour.bracketRounds&&tour.bracketRounds.length&&
    tour.bracketRounds.some(function(r){return r.matches&&r.matches[0]&&!r.matches[0].is3rd;});
  var qualLabel=hasBracket?'Qualified – Playoffs (Top '+adv+')':'Qualified (Top '+adv+')';
  h+='<div class="z-legend">'+
    '<span class="zl"><span class="zl-dot" style="background:var(--green)"></span><span style="color:var(--green)">'+qualLabel+'</span></span>'+
    '<span class="zl"><span class="zl-dot" style="background:var(--red)"></span><span style="color:var(--red)">Eliminated</span></span>'+
    '</div>';
  return h;
}

function toggleRound(uid){
  var el=document.getElementById(uid);
  var arr=document.getElementById('arr_'+uid);
  if(!el) return;
  var isOpen=el.classList.contains('expanded');
  if(isOpen){
    el.style.maxHeight=el.scrollHeight+'px';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.classList.add('collapsed');
        el.classList.remove('expanded');
      });
    });
  } else {
    el.classList.remove('collapsed');
    el.classList.add('expanded');
    el.style.maxHeight=el.scrollHeight+'px';
    setTimeout(function(){el.style.maxHeight='none';},300);
  }
  if(arr) arr.style.transform=isOpen?'rotate(-90deg)':'rotate(0deg)';
}

// ── FIXTURES ───────────────────────────────────────────────────
function resolveTeamName(m,side){
  var tour=getTour();
  var id=side==='home'?m.homeId:m.awayId;
  var fallback=side==='home'?m.homeName:m.awayName;
  if(tour&&id){var t=(tour.teams||[]).find(function(t){return t.id===id;});if(t)return t.name;}
  return fallback||'';
}
function getCoachById(teamId){
  if(!teamId) return null;
  var reg=registryTeams.find(function(r){return r.id===teamId;});
  return reg&&reg.coach?reg.coach:null;
}
function getCoach(teamName){
  var reg=registryTeams.find(function(r){return r.name.trim().toLowerCase()===(teamName||'').trim().toLowerCase();});
  return reg&&reg.coach?reg.coach:null;
}
function resolveCoach(m,side){
  var id=side==='home'?m.homeId:m.awayId;
  return getCoachById(id)||getCoach(resolveTeamName(m,side))||getCoach(side==='home'?m.homeName:m.awayName)||null;
}

function buildFixCard(homeName,awayName,footerLeft,footerRight,match){
  var homeCoach=getCoach(homeName);
  var awayCoach=getCoach(awayName);
  var tour=getTour();
  var homeTourTeam=(match&&tour)?(tour.teams.find(function(t){return t.id===match.homeId;})||{name:homeName}):{name:homeName};
  var awayTourTeam=(match&&tour)?(tour.teams.find(function(t){return t.id===match.awayId;})||{name:awayName}):{name:awayName};
  var homeReg=resolveRegTeam(homeTourTeam);
  var awayReg=resolveRegTeam(awayTourTeam);
  return '<div class="fix-item">'+
    '<div class="fix-header">'+
    '<div class="fix-team-side fix-home">'+
    '<div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.15rem">'+logoImg(homeName,26,homeReg)+
    '<div class="fix-team-name">'+homeName+'</div></div>'+
    (homeCoach?'<div class="fix-team-coach">🧢 '+homeCoach+'</div>':'<div class="fix-team-coach" style="opacity:0">–</div>')+
    '</div>'+
    '<div class="fix-vs-badge">VS</div>'+
    '<div class="fix-team-side fix-away">'+
    '<div style="display:flex;align-items:center;justify-content:flex-end;gap:.4rem;margin-bottom:.15rem">'+
    '<div class="fix-team-name">'+awayName+'</div>'+logoImg(awayName,26,awayReg)+'</div>'+
    (awayCoach?'<div class="fix-team-coach">'+awayCoach+' 🧢</div>':'<div class="fix-team-coach" style="opacity:0">–</div>')+
    '</div>'+
    '</div>'+
    '<div class="fix-footer">'+
    '<span class="fix-date">'+footerLeft+'</span>'+
    '<span class="fix-round-label">'+footerRight+'</span>'+
    '</div>'+

        '<div style="flex:1;height:1px;background:var(--border)"></div>'+
        '</div>';
      rm.forEach(function(m){
        var hn=resolveTeamName(m,'home'),an=resolveTeamName(m,'away');
        h+='<div style="background:rgba(255,59,92,.04);border:1px solid rgba(255,59,92,.12);border-radius:10px;padding:.7rem 1rem;margin-bottom:.4rem;display:flex;align-items:center;justify-content:space-between">'+

          '</div>';
      });
      h+='</div>';
    });
    h+='</div>';
  }
  el.innerHTML=h;
}

// ── PLAYOFFS ───────────────────────────────────────────────────
function renderPlayoffs(){
  var tour=getTour();
  var bc=document.getElementById('bracketContent');
  if(!tour){bc.innerHTML='<div class="empty">No data</div>';return;}
  if(!tour.bracketRounds||!tour.bracketRounds.length){
    if(tour.playoffs&&tour.playoffs.length){
      bc.innerHTML=tour.playoffs.map(function(po){
        return '<div class="po-item">'+
          '<div class="po-teams">'+po.home+' vs '+po.away+'</div>'+
          '<div class="po-meta">'+(po.round||'')+(po.date?' &middot; '+po.date:'')+'</div>'+
          (po.score?'<div class="po-score">'+po.score+'</div>':'')+
          (po.agg?'<div style="text-align:center;font-size:.72rem;color:var(--muted);font-family:\'Oswald\',sans-serif;letter-spacing:1px">Agg: '+po.agg+'</div>':'')+
          (po.winner?'<div class="po-winner">🏆 Winner: '+po.winner+'</div>':po.done?'':'<div style="text-align:center;font-size:.72rem;color:var(--muted);font-family:\'Oswald\',sans-serif">Pending</div>')+
          '</div>';
      }).join('');
      return;
    }
    bc.innerHTML='<div class="empty"><div class="empty-icon">🏆</div>No playoffs data</div>';
    return;
  }
  var mainRounds=tour.bracketRounds.filter(function(r){return r.matches[0]&&!r.matches[0].is3rd;});
  var thirdRound=tour.bracketRounds.find(function(r){return r.matches[0]&&r.matches[0].is3rd;});
  if(!mainRounds.length){bc.innerHTML='<div class="empty"><div class="empty-icon">🏆</div>Bracket is being set up</div>';return;}

  function etPkBadge(etH,etA,pkH,pkA){
    var s='';
    if(etH!=null&&etA!=null) s+='<span style="color:var(--blue);font-size:.58rem;margin-left:.3rem">ET '+etH+'–'+etA+'</span>';
    if(pkH!=null&&pkA!=null) s+='<span style="color:#ff9500;font-size:.58rem;margin-left:.3rem">PK '+pkH+'–'+pkA+'</span>';
    return s;
  }
  function matchCard(m){
    var t1=m.t1?m.t1.name:'TBD',t2=m.t2?m.t2.name:'TBD';
    var isHA=m.legs===2;
    var s1=m.leg1h!=null&&m.leg1a!=null?m.leg1h+'–'+m.leg1a:null;
    var s2=m.leg2h!=null&&m.leg2a!=null?m.leg2h+'–'+m.leg2a:null;
    var wn=m.winner?m.winner.name:null,w1=wn===t1,w2=wn===t2;
    var leg2Line='';
    if(isHA){
      var agg1=s1&&s2?(m.leg1h||0)+(m.leg2a||0)+(m.et1h||0)+(m.et2a||0):null;
      var agg2=s1&&s2?(m.leg1a||0)+(m.leg2h||0)+(m.et1a||0)+(m.et2h||0):null;
      var aggStr=agg1!=null?' · Agg: '+agg1+'–'+agg2:'';
      leg2Line='<div style="font-size:.6rem;color:var(--muted);border-top:1px solid rgba(255,255,255,.07);padding-top:.25rem;margin-top:.15rem">'+
        '<span>Leg 1: '+(s1||'TBC')+etPkBadge(m.et1h,m.et1a,m.pk1h,m.pk1a)+'</span><br>'+
        '<span>Leg 2: '+(s2||'TBC')+etPkBadge(m.et2h,m.et2a,m.pk2h,m.pk2a)+aggStr+'</span></div>';
    }
    return '<div style="background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:.55rem .7rem;font-size:.75rem">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem">'+
      '<span style="font-family:\'DM Sans\',sans-serif;font-weight:700;color:'+(w1?'var(--gold)':'var(--text)')+';flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%">'+t1+(w1?' 🏆':'')+'</span>'+
      '<span style="font-family:\'Anton\',sans-serif;font-size:.8rem;color:'+(s1?'var(--text)':'var(--muted)')+';min-width:2.5rem;text-align:right">'+(isHA?'':s1||'TBC')+'</span></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center'+(isHA?';margin-bottom:.2rem':'')+'">'+
      '<span style="font-family:\'DM Sans\',sans-serif;font-weight:700;color:'+(w2?'var(--gold)':'var(--text)')+';flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%">'+t2+(w2?' 🏆':'')+'</span>'+
      '<span style="font-family:\'Anton\',sans-serif;font-size:.8rem;color:var(--muted);min-width:2.5rem;text-align:right">'+(isHA?'':'–')+'</span></div>'+
      (isHA?leg2Line:(!isHA&&m.et1h!=null?'<div style="margin-top:.2rem;font-size:.6rem">'+etPkBadge(m.et1h,m.et1a,m.pk1h,m.pk1a)+'</div>':''))+
      (!wn&&!m.done?'<div style="font-size:.6rem;color:var(--muted);text-align:center;margin-top:.2rem;font-family:\'Oswald\',sans-serif;letter-spacing:1px">⏳ Pending</div>':'')+
      '</div>';
  }
  function compactCard(m){
    var t1=m.t1?m.t1.name:'TBD',t2=m.t2?m.t2.name:'TBD';
    var isHA=m.legs===2;
    var s1=m.leg1h!=null&&m.leg1a!=null?m.leg1h+'–'+m.leg1a:null;
    var s2=m.leg2h!=null&&m.leg2a!=null?m.leg2h+'–'+m.leg2a:null;
    var w1=m.winner&&m.winner.name===t1,w2=m.winner&&m.winner.name===t2;
    var scoreLabel='–';
    if(isHA&&s1&&s2) scoreLabel=((m.leg1h||0)+(m.leg2a||0)+(m.et1h||0)+(m.et2a||0))+'–'+((m.leg1a||0)+(m.leg2h||0)+(m.et1a||0)+(m.et2h||0));
    else if(!isHA&&s1) scoreLabel=s1;
    var etPk=[];
    if(m.et1h!=null) etPk.push('ET '+m.et1h+'–'+m.et1a);
    if(m.pk1h!=null) etPk.push('PK '+m.pk1h+'–'+m.pk1a);
    if(m.pk2h!=null&&isHA) etPk.push('PK '+m.pk2h+'–'+m.pk2a);
    return '<div style="background:rgba(255,255,255,.05);border:1px solid '+(m.done?'rgba(201,168,76,.5)':'var(--border)')+';border-radius:6px;padding:.3rem .4rem;font-size:.68rem;width:100%;box-sizing:border-box">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:2px;margin-bottom:.15rem">'+
      '<span style="font-family:\'DM Sans\',sans-serif;font-weight:700;color:'+(w1?'var(--gold)':'var(--text)')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0">'+t1+'</span>'+
      '<span style="font-family:\'Anton\',sans-serif;color:'+(scoreLabel!=='–'?'var(--text)':'var(--muted)')+';flex-shrink:0;font-size:.75rem;margin-left:2px">'+scoreLabel+'</span></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:2px">'+
      '<span style="font-family:\'DM Sans\',sans-serif;font-weight:700;color:'+(w2?'var(--gold)':'var(--text)')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0">'+t2+'</span>'+
      '<span style="font-family:\'Anton\',sans-serif;color:var(--muted);flex-shrink:0;font-size:.75rem;margin-left:2px">'+(isHA&&s1&&!s2?s1:'')+'</span></div>'+
      (etPk.length?'<div style="font-size:.55rem;color:#ff9500;margin-top:.1rem;text-align:center;font-family:\'Oswald\',sans-serif">'+etPk.join(' · ')+'</div>':
        (!m.done&&!m.winner?'<div style="font-size:.55rem;color:var(--muted);text-align:center;margin-top:.1rem">⏳</div>':''))+
      '</div>';
  }

  var finalRound=mainRounds[mainRounds.length-1];
  var preFinal=mainRounds.slice(0,mainRounds.length-1);
  var leftCols=preFinal.map(function(r){return{name:r.name,matches:r.matches.slice(0,Math.ceil(r.matches.length/2))};});
  var rightCols=preFinal.slice().reverse().map(function(r){return{name:r.name,matches:r.matches.slice(Math.ceil(r.matches.length/2))};});
  var CF=10,CN=1.5,CC=16;

  function connector(dir){
    var ir=dir==='right';
    return '<div style="flex:'+CN+';display:flex;flex-direction:column;justify-content:center;align-items:center;align-self:stretch;min-width:0">'+
      '<div style="flex:1;'+(ir?'border-right':'border-left')+':2px solid rgba(201,168,76,.4);border-top:2px solid rgba(201,168,76,.4);'+(ir?'border-radius:0 6px 0 0':'border-radius:6px 0 0 0')+';width:50%;'+(ir?'margin-right:-1px':'margin-left:-1px')+'"></div>'+
      '<div style="width:100%;height:2px;background:rgba(201,168,76,.4)"></div>'+
      '<div style="flex:1;'+(ir?'border-right':'border-left')+':2px solid rgba(201,168,76,.4);border-bottom:2px solid rgba(201,168,76,.4);'+(ir?'border-radius:0 0 6px 0':'border-radius:0 0 0 6px')+';width:50%;'+(ir?'margin-right:-1px':'margin-left:-1px')+'"></div>'+
      '</div>';
  }
  function colLabel(n){return '<div style="font-family:\'Oswald\',sans-serif;font-size:.62rem;letter-spacing:2px;color:var(--gold);text-align:center;margin-bottom:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase">'+n+'</div>';}

  var html='<div style="width:100%;padding:.5rem 0 1rem;box-sizing:border-box">'+
    '<div style="display:flex;width:100%;align-items:stretch;box-sizing:border-box;padding:0 2px">';
  leftCols.forEach(function(col){
    html+='<div style="flex:'+CF+';display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">'+colLabel(col.name)+col.matches.map(compactCard).join('<div style="min-height:6px"></div>')+'</div>';
    html+=connector('right');
  });
  html+='<div style="flex:'+CC+';display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:0 2px">'+
    '<img src="jalala_cup.png" style="width:80%;max-width:120px;height:auto;object-fit:contain;filter:drop-shadow(0 0 20px rgba(201,168,76,0.9));display:block;margin:0 auto">'+
    '<div style="font-family:\'Oswald\',sans-serif;font-size:clamp(.6rem,.8rem,1rem);letter-spacing:3px;color:var(--gold);text-align:center;margin:.2rem 0 .4rem;text-shadow:0 0 8px rgba(201,168,76,.6);text-transform:uppercase">Final</div>'+
    '<div style="width:100%">'+compactCard(finalRound.matches[0])+'</div>'+
    (finalRound.matches[0].winner?'<div style="font-family:\'Anton\',sans-serif;font-size:clamp(.6rem,.8rem,1rem);color:var(--gold);text-align:center;margin-top:.3rem;letter-spacing:2px">🏆 '+finalRound.matches[0].winner.name+'</div>':'')+
    '</div>';
  rightCols.forEach(function(col){
    html+=connector('left');
    html+='<div style="flex:'+CF+';display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">'+colLabel(col.name)+col.matches.map(compactCard).join('<div style="min-height:6px"></div>')+'</div>';
  });
  html+='</div></div>';

  if(thirdRound){
    html+='<div style="margin-top:.7rem;background:rgba(205,127,50,.07);border:1px solid rgba(205,127,50,.25);border-radius:10px;padding:.7rem .9rem">'+
      '<div style="font-family:\'Oswald\',sans-serif;font-size:.65rem;letter-spacing:2px;color:#cd7f32;margin-bottom:.4rem;text-transform:uppercase">🥉 3rd Place</div>'+
      matchCard(thirdRound.matches[0])+
      (thirdRound.matches[0].winner?'<div style="font-family:\'Oswald\',sans-serif;font-size:.6rem;color:#cd7f32;text-align:center;margin-top:.3rem;letter-spacing:1px">3rd: '+thirdRound.matches[0].winner.name+'</div>':'')+
      '</div>';
  }

  var allR=mainRounds.concat(thirdRound?[thirdRound]:[]);
  var doneR=allR.filter(function(r){return r.matches.some(function(m){return m.done;});});
  if(doneR.length){
    html+='<div style="margin-top:1rem;padding:.3rem 0">'+
      '<div style="font-family:\'Oswald\',sans-serif;font-size:.8rem;letter-spacing:2px;color:var(--gold);padding:.4rem .9rem;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:8px;margin-bottom:.5rem;text-transform:uppercase">Results</div>';
    doneR.forEach(function(r){
      var dm=r.matches.filter(function(m){return m.done;});
      if(!dm.length) return;
      var isFinal=r.matches[0]&&r.matches[0].isFinal;
      var is3rd=r.matches[0]&&r.matches[0].is3rd;
      var rl=is3rd?'🥉 3rd Place':isFinal?'🏆 Final':r.name;
      html+='<div style="margin-bottom:.7rem">'+
        '<div style="font-family:\'Oswald\',sans-serif;font-size:.62rem;font-weight:400;letter-spacing:1.5px;color:'+(isFinal?'var(--gold)':is3rd?'#cd7f32':'var(--green)')+';padding:.2rem .5rem;background:rgba(255,255,255,.03);border-radius:4px;margin-bottom:.4rem;display:inline-block;text-transform:uppercase">'+rl+'</div>';
      dm.forEach(function(m){
        var t1=m.t1?m.t1.name:'?',t2=m.t2?m.t2.name:'?';
        var isHA=m.legs===2,w=m.winner?m.winner.name:null;
        var sd='';
        if(isHA){
          var s1r=m.leg1h!=null?m.leg1h+'–'+m.leg1a:'?';
          var s2r=m.leg2h!=null?m.leg2h+'–'+m.leg2a:'?';
          sd='<div style="font-size:.62rem;color:var(--muted);font-family:\'Oswald\',sans-serif">Leg 1: '+s1r+' · Leg 2: '+s2r+'</div>'+
            '<div style="font-family:\'Anton\',sans-serif;font-size:.9rem;color:var(--gold);letter-spacing:1px">Agg: '+((m.leg1h||0)+(m.leg2a||0)+(m.et1h||0)+(m.et2a||0))+'–'+((m.leg1a||0)+(m.leg2h||0)+(m.et1a||0)+(m.et2h||0))+'</div>';
        } else {
          sd='<div style="font-family:\'Anton\',sans-serif;font-size:1rem;color:var(--gold);letter-spacing:2px">'+(m.leg1h!=null?m.leg1h+'–'+m.leg1a:'?')+'</div>';
        }
        var ep=[];
        if(m.et1h!=null) ep.push('ET '+m.et1h+'–'+m.et1a);
        if(m.pk1h!=null) ep.push('PK '+m.pk1h+'–'+m.pk1a);
        if(m.et2h!=null&&isHA) ep.push('ET2 '+m.et2h+'–'+m.et2a);
        if(m.pk2h!=null&&isHA) ep.push('PK2 '+m.pk2h+'–'+m.pk2a);
        html+='<div style="display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--border)">'+
          '<div style="flex:1;min-width:0">'+
          '<div style="font-family:\'DM Sans\',sans-serif;font-weight:700;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
          '<span style="color:'+(w===t1?'var(--gold)':'var(--text)')+'">'+t1+'</span>'+
          '<span style="color:var(--muted);font-weight:400;font-size:.75rem"> vs </span>'+
          '<span style="color:'+(w===t2?'var(--gold)':'var(--text)')+'">'+t2+'</span></div>'+
          (ep.length?'<div style="font-size:.6rem;color:#ff9500;margin-top:.1rem;font-family:\'Oswald\',sans-serif">'+ep.join(' · ')+'</div>':'')+
          '</div>'+
          '<div style="text-align:right;flex-shrink:0">'+sd+(w?'<div style="font-family:\'Oswald\',sans-serif;font-size:.6rem;color:var(--green);font-weight:400;letter-spacing:1px">🏆 '+w+'</div>':'')+'</div>'+
          '</div>';
      });
      html+='</div>';
    });
    html+='</div>';
  }
  bc.innerHTML=html;
}

// ── GOALS RANKING ──────────────────────────────────────────────
function renderGoalsRanking(){
  var tour=getTour();
  var el=document.getElementById('secGoals');
  if(!tour){el.innerHTML='<div class="empty">No data</div>';return;}
  if(!tour.teams.length){el.innerHTML='<div class="empty"><div class="empty-icon">👥</div>No teams yet</div>';return;}
  var pg={};
  if(tour.bracketRounds) tour.bracketRounds.forEach(function(r){
    r.matches.forEach(function(m){
      if(!m.t1||!m.t2) return;
      var i1=m.t1.id,i2=m.t2.id;
      if(!pg[i1]) pg[i1]=0;if(!pg[i2]) pg[i2]=0;
      if(m.leg1h!=null){pg[i1]+=m.leg1h;pg[i2]+=m.leg1a;}
      if(m.et1h!=null){pg[i1]+=m.et1h;pg[i2]+=m.et1a;}
      if(m.leg2h!=null){pg[i2]+=m.leg2h;pg[i1]+=m.leg2a;}
      if(m.et2h!=null){pg[i2]+=m.et2h;pg[i1]+=m.et2a;}
    });
  });
  var sorted=tour.teams.map(function(t){
    var gs=t.goalsFor||0,po=pg[t.id]||0;
    return{name:t.name,id:t.id,groupGoals:gs,playoffGoals:po,totalGoals:gs+po};
  }).sort(function(a,b){return b.totalGoals-a.totalGoals;});
  var max=sorted[0].totalGoals||1;
  var hasPlayoffs=sorted.some(function(t){return t.playoffGoals>0;});
  var h='<div style="padding:.9rem .8rem">'+
    '<div style="font-family:\'Anton\',sans-serif;font-size:1.3rem;letter-spacing:3px;color:var(--gold);margin-bottom:.5rem;text-align:center;text-transform:uppercase">Team Goals Ranking</div>';
  if(hasPlayoffs){
    h+='<div style="display:flex;justify-content:center;gap:1.2rem;margin-bottom:1.2rem;font-family:\'Oswald\',sans-serif;font-size:.65rem;color:var(--muted);letter-spacing:1px">'+
      '<span><span style="color:var(--gold)">■</span> Group Stage</span>'+
      '<span><span style="color:var(--blue)">■</span> Playoffs</span>'+
      '</div>';
  } else {h+='<div style="margin-bottom:1rem"></div>';}
  sorted.forEach(function(t,i){
    var gsPct=Math.round((t.groupGoals/max)*100);
    var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    var rankColor=i===0?'var(--gold)':i===1?'#c0c0c0':i===2?'#cd7f32':'var(--muted)';
    var scoreHtml;
    if(hasPlayoffs){
      scoreHtml='<div style="text-align:right">'+
        '<div style="font-family:\'Anton\',sans-serif;font-size:1.1rem;color:var(--gold);background:rgba(201,168,76,.1);padding:.1rem .5rem;border-radius:6px;display:inline-block">'+t.totalGoals+' <span style="font-family:\'Oswald\',sans-serif;font-size:.65rem;color:var(--muted)">Total</span></div>'+
        '<div style="font-family:\'Oswald\',sans-serif;font-size:.6rem;color:var(--muted);margin-top:.2rem;white-space:nowrap;letter-spacing:.5px">'+
        '<span style="color:var(--gold)">'+t.groupGoals+' GS</span>'+
        (t.playoffGoals>0?'  <span style="color:var(--blue)">+'+t.playoffGoals+' PO</span>':'')+
        '</div></div>';
    } else {
      scoreHtml='<div style="font-family:\'Anton\',sans-serif;font-size:1.1rem;color:var(--gold);background:rgba(201,168,76,.1);padding:.15rem .6rem;border-radius:6px">'+t.totalGoals+' <span style="font-family:\'Oswald\',sans-serif;font-size:.7rem;color:var(--muted)">GF</span></div>';
    }
    var barHtml='<div style="background:var(--border);border-radius:4px;height:6px;overflow:hidden;display:flex">';
    if(t.groupGoals>0) barHtml+='<div style="height:100%;width:'+gsPct+'%;background:linear-gradient(90deg,rgba(201,168,76,.7),var(--gold));border-radius:4px 0 0 4px;transition:width .4s"></div>';
    if(t.playoffGoals>0){
      var poPct=Math.round((t.playoffGoals/max)*100);
      barHtml+='<div style="height:100%;width:'+poPct+'%;background:var(--blue);'+(t.groupGoals===0?'border-radius:4px':'border-radius:0 4px 4px 0')+';transition:width .4s"></div>';
    }
    barHtml+='</div>';
    h+='<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:.6rem;transition:border-color .2s" onmouseenter="this.style.borderColor=\'rgba(201,168,76,.3)\'" onmouseleave="this.style.borderColor=\'var(--border)\'">'+
      '<div style="display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem">'+
      '<div style="font-family:\'Anton\',sans-serif;font-size:1.1rem;color:'+rankColor+';width:1.4rem;text-align:center">'+( i+1)+'</div>'+
      '<div style="flex:1;font-family:\'DM Sans\',sans-serif;font-weight:700;font-size:.9rem">'+medal+' '+t.name+'</div>'+
      scoreHtml+
      '</div>'+barHtml+'</div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

// ── TEAMS ──────────────────────────────────────────────────────
function renderTeams(){
  var tour=getTour();
  var el=document.getElementById('secTeams');
  if(!tour||!tour.teams||!tour.teams.length){el.innerHTML='<div class="empty"><div class="empty-icon">👥</div>No teams yet</div>';return;}
  var sorted=tour.teams.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var opts=sorted.map(function(t){return'<option value="'+t.id+'">'+t.name+'</option>';}).join('');
  var h='<div class="team-select-wrap">'+
    '<label>Select a Team</label>'+
    '<select class="team-dropdown" id="teamPickerDropdown" onchange="showTeamCard(this.value)">'+
    '<option value="">— Choose a team —</option>'+opts+'</select></div>'+
    '<div id="teamCardContainer"></div>';
  el.innerHTML=h;
}

function showTeamCard(tid){
  var tour=getTour();
  var container=document.getElementById('teamCardContainer');
  if(!tid||!tour){container.innerHTML='';return;}
  var t=tour.teams.find(function(x){return x.id===tid;});
  if(!t){container.innerHTML='';return;}
  var rankedTeams=sortTeams(tour.teams);
  var pos=rankedTeams.findIndex(function(x){return x.id===tid;})+1;
  var posLabel=pos===1?'1st 🥇':pos===2?'2nd 🥈':pos===3?'3rd 🥉':pos+'th';
  var played=(tour.matches||[]).filter(function(m){return m.done&&(m.homeId===tid||m.awayId===tid);});
  var last5=played.slice(-5);
  var formSquares='';
  if(last5.length){
    last5.forEach(function(m){
      var isHome=m.homeId===tid;
      var gf=isHome?m.homeScore:m.awayScore;
      var ga=isHome?m.awayScore:m.homeScore;
      var res=gf>ga?'W':gf===ga?'D':'L';
      formSquares+='<div class="form-sq '+res+'">'+res+'</div>';
    });
  } else {formSquares='<div class="form-sq none">–</div>'.repeat(5);}
  var pgFor=0,pgAg=0,hasPlayoffs=false;
  if(tour.bracketRounds&&tour.bracketRounds.length){
    tour.bracketRounds.forEach(function(r){
      r.matches.forEach(function(m){
        if(!m.t1||!m.t2) return;
        var isT1=m.t1.id===tid,isT2=m.t2.id===tid;
        if(!isT1&&!isT2) return;
        hasPlayoffs=true;
        if(m.leg1h!=null){pgFor+=isT1?m.leg1h:m.leg1a;pgAg+=isT1?m.leg1a:m.leg1h;}
        if(m.et1h!=null){pgFor+=isT1?m.et1h:m.et1a;pgAg+=isT1?m.et1a:m.et1h;}
        if(m.leg2h!=null){pgFor+=isT2?m.leg2h:m.leg2a;pgAg+=isT2?m.leg2a:m.leg2h;}
        if(m.et2h!=null){pgFor+=isT2?m.et2h:m.et2a;pgAg+=isT2?m.et2a:m.et2h;}
      });
    });
  }
  var gd=t.goalsFor-t.goalsAgainst;
  var gdStr=(gd>=0?'+':'')+gd;
  var gdColor=gd>0?'var(--green)':gd<0?'var(--red)':'var(--text)';
  var winRate=t.played>0?Math.round((t.won/t.played)*100):0;
  var h='<div class="team-card">'+
    '<div class="team-card-header">'+
    '<div class="team-card-avatar">👥</div>'+
    '<div class="team-card-title">'+
    '<div class="team-card-name">'+t.name+'</div>'+
    '<div class="team-card-coach">'+(t.coach?'🧢 Coach: '+t.coach:'No coach listed')+'</div>'+
    '</div>'+
    '<div class="team-card-pos">'+posLabel+'<br><span style="font-family:\'Oswald\',sans-serif;font-size:.52rem;color:var(--muted);letter-spacing:1px">RANK</span></div>'+
    '</div>'+
    '<div class="team-stats-grid">'+
    '<div class="stat-cell"><div class="stat-val">'+t.played+'</div><div class="stat-lbl">Played</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:var(--green)">'+t.won+'</div><div class="stat-lbl">Won</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:var(--gold)">'+t.drawn+'</div><div class="stat-lbl">Drawn</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:var(--red)">'+t.lost+'</div><div class="stat-lbl">Lost</div></div>'+
    '<div class="stat-cell"><div class="stat-val">'+t.goalsFor+'</div><div class="stat-lbl">GF</div></div>'+
    '<div class="stat-cell"><div class="stat-val">'+t.goalsAgainst+'</div><div class="stat-lbl">GA</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:'+gdColor+'">'+gdStr+'</div><div class="stat-lbl">GD</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:var(--gold);font-size:1.5rem">'+t.points+'</div><div class="stat-lbl">Points</div></div>'+
    '</div>'+
    '<div class="team-card-body">'+
    '<div class="form-row">'+
    '<span class="form-label">Form</span>'+
    '<div class="form-squares">'+formSquares+'</div>'+
    '</div>'+
    '<div class="extra-stats">'+
    '<div class="extra-stat-item"><span class="extra-stat-lbl">Win Rate</span><span class="extra-stat-val">'+winRate+'%</span></div>'+
    (hasPlayoffs?
      '<div class="extra-stat-item"><span class="extra-stat-lbl">Playoff GF</span><span class="extra-stat-val" style="color:var(--blue)">'+pgFor+'</span></div>'+
      '<div class="extra-stat-item"><span class="extra-stat-lbl">Playoff GA</span><span class="extra-stat-val">'+pgAg+'</span></div>'
    :'')+
    '<div class="extra-stat-item"><span class="extra-stat-lbl">Tournament</span><span class="extra-stat-val" style="font-size:.75rem;font-family:\'DM Sans\',sans-serif;font-weight:700;color:var(--muted)">'+tour.name+'</span></div>'+
    '</div>'+
    '</div>'+
    '</div>';
  container.innerHTML=h;
}

// ── RULES ──────────────────────────────────────────────────────
function renderRules(){
  var tour=getTour();
  var el=document.getElementById('secRules');
  if(!tour||!tour.rulesBody){el.innerHTML='<div class="empty"><div class="empty-icon">📜</div>No rules posted yet</div>';return;}
  el.innerHTML='<div style="padding:.9rem .8rem">'+
    '<div style="display:flex;align-items:center;gap:.6rem;margin-bottom:1.2rem">'+
    '<div style="flex:1;height:1px;background:var(--border)"></div>'+
    '<div style="font-family:\'Oswald\',sans-serif;font-size:.8rem;letter-spacing:2px;color:var(--gold);padding:.2rem .9rem;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);border-radius:20px;white-space:nowrap;text-transform:uppercase">📜 '+(tour.rulesTitle||'Rules & Regulations')+'</div>'+
    '<div style="flex:1;height:1px;background:var(--border)"></div></div>'+
    '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem;white-space:pre-wrap;font-family:\'DM Sans\',sans-serif;font-size:.88rem;line-height:1.9;color:var(--text)">'+tour.rulesBody.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>'+
    '</div>';
}

// ── WINNER TICKER ──────────────────────────────────────────────
function updateWinnerTicker(){
  var tour=getTour();
  var tTop=document.getElementById('winnerTickerTop');
  var tBot=document.getElementById('winnerTickerBottom');
  var txTop=document.getElementById('winnerTickerTextTop');
  var txBot=document.getElementById('winnerTickerTextBottom');
  updateTrophySplash(tour);
  if(!tour||!tour.winnerTickerOn){
    tTop.style.display='none';tBot.style.display='none';
    document.body.style.paddingBottom='3rem';document.body.style.paddingTop='0';
    return;
  }
  var wn='';
  if(tour.bracketRounds&&tour.bracketRounds.length){
    var frs=tour.bracketRounds.filter(function(r){return r.matches[0]&&!r.matches[0].is3rd;});
    var fr=frs[frs.length-1];
    if(fr&&fr.matches[0]&&fr.matches[0].winner) wn=fr.matches[0].winner.name;
  }
  var msg=wn
    ?'🏆  PRIME eFOOTBALL LEAGUE '+(tour.name||'')+' WINNER IS  ★  '+wn.toUpperCase()+'  ★  CONGRATULATIONS  🎉    🏆  PRIME eFOOTBALL LEAGUE '+(tour.name||'')+' WINNER IS  ★  '+wn.toUpperCase()+'  ★  CONGRATULATIONS  🎉'
    :'🏆  PRIME eFOOTBALL LEAGUE '+(tour.name||'')+' — FINALS UNDERWAY — STAY TUNED  🏆';
  txTop.textContent=msg;txBot.textContent=msg;
  tTop.style.display='flex';tBot.style.display='flex';
  document.body.style.paddingTop='2.2rem';document.body.style.paddingBottom='5rem';
}

function updateTrophySplash(tour){
  var splash=document.getElementById('trophySplash');
  if(!splash) return;
  if(!tour||!tour.winnerTickerOn||!tour.winnerTrophyImg){splash.style.display='none';return;}
  var wn='';
  if(tour.bracketRounds&&tour.bracketRounds.length){
    var frs=tour.bracketRounds.filter(function(r){return r.matches[0]&&!r.matches[0].is3rd;});
    var fr=frs[frs.length-1];
    if(fr&&fr.matches[0]&&fr.matches[0].winner) wn=fr.matches[0].winner.name;
  }
  splash.innerHTML='<div style="text-align:center;padding:1.2rem .8rem 0">'+
    '<div style="font-family:\'Oswald\',sans-serif;font-size:.72rem;letter-spacing:3px;color:var(--gold);margin-bottom:.5rem;text-shadow:0 0 12px rgba(201,168,76,.6);text-transform:uppercase">🏆 '+(tour.name||'PFL')+' Champion 🏆</div>'+
    '<img src="'+tour.winnerTrophyImg+'" alt="Winner Trophy" style="width:70%;max-width:260px;height:auto;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 0 22px rgba(201,168,76,0.95)) drop-shadow(0 0 45px rgba(201,168,76,0.55));animation:trophyGlow 2.5s ease-in-out infinite alternate">'+
    (wn?'<div style="font-family:\'Anton\',sans-serif;font-size:1.5rem;letter-spacing:4px;color:var(--gold);margin-top:.6rem;text-shadow:0 0 20px rgba(201,168,76,.8)">'+wn+'</div>':'')+
    '<div style="font-family:\'Oswald\',sans-serif;font-size:.62rem;color:var(--muted);letter-spacing:2px;margin-top:.2rem;text-transform:uppercase">Prime eFootball League Champions</div>'+
    '<div style="height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:1rem 0 .3rem"></div>'+
    '</div>';
  splash.style.display='block';
}

// ── Boot ───────────────────────────────────────────────────────
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
} else {
  init();
}
